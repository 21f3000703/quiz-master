<!DOCTYPE html>
<html lang="en">
<head>
    <title>Manage Questions</title>
</head>
<body>
    <h1>Manage Questions for Quiz: {{ quiz.title }}</h1>
    <a href="{{ url_for('manage_quizzes', chapter_id=quiz.chapter_id) }}" class="btn btn-secondary">Back to Quizzes</a>
    <a href="{{ url_for('add_question', quiz_id=quiz.id) }}" class="btn btn-primary">Add New Question</a>

    <ul>
        {% for question in questions %}
            <li>
                {{ question.text }}
                <a href="{{ url_for('edit_question', question_id=question.id) }}">Edit</a>
                <a href="{{ url_for('delete_question', question_id=question.id) }}">Delete</a>
            </li>
        {% else %}
            <li>No questions added yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
