<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Quizzes</title>
</head>
<body>
    <h1>Manage Quizzes for Chapter: {{ chapter.name }}</h1>
    
    <a href="{{ url_for('add_quiz', chapter_id=chapter.id) }}">Add New Quiz</a>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Date</th>
                <th>Duration</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for quiz in quizzes %}
            <tr>
                <td>{{ quiz.id }}</td>
                <td>{{ quiz.title }}</td>
                <td>{{ quiz.description }}</td>
                <td>{{ quiz.date }}</td>
                <td>{{ quiz.duration }}</td>
                <td>
                    <a href="{{ url_for('edit_quiz', quiz_id=quiz.id) }}">Edit</a>
                    <a href="{{ url_for('delete_quiz', quiz_id=quiz.id) }}" onclick="return confirm('Are you sure you want to delete this quiz?');">Delete</a>
                    <a href="{{ url_for('manage_questions', quiz_id=quiz.id) }}">Manage Questions</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('manage_chapters', subject_id=chapter.subject_id) }}">Back to Chapters</a>
</body>
</html>
