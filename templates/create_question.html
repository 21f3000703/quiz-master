<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2>Add a New Question</h2>
        <a href="{{ url_for('manage_questions') }}" class="btn btn-secondary mb-3">Back to Manage Questions</a>

        <form method="POST">
            <div class="mb-3">
                <label for="question_text" class="form-label">Question Text</label>
                <input type="text" class="form-control" id="question_text" name="question_text" required>
            </div>
            <div class="mb-3">
                <label for="quiz_id" class="form-label">Select Quiz</label>
                <select class="form-select" id="quiz_id" name="quiz_id" required>
                    {% for quiz in quizzes %}
                        <option value="{{ quiz.id }}">{{ quiz.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Add Question</button>
        </form>
    </div>
</body>
</html>
