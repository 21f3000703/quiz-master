<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Subjects</title>
</head>
<body>
    <h1>Manage Subjects</h1>
    <a href="{{ url_for('add_subject') }}">Add New Subject</a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for subject in subjects %}
            <tr>
                <td>{{ subject.id }}</td>
                <td>{{ subject.name }}</td>
                <td>{{ subject.description }}</td>
                <td>
                    <a href="{{ url_for('edit_subject', subject_id=subject.id) }}">Edit</a>
                    <a href="{{ url_for('delete_subject', subject_id=subject.id) }}" onclick="return confirm('Are you sure you want to delete this subject?');">Delete</a>
                    <!-- Link to manage chapters for this subject -->
                    <a href="{{ url_for('manage_chapters', subject_id=subject.id) }}">Manage Chapters</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>
</body>
</html>
