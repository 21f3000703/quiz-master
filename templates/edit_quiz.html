<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Quiz</title>
</head>
<body>
    <h1>Edit Quiz: {{ quiz.title }}</h1>

    <form method="POST">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ quiz.title }}" required><br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description">{{ quiz.description }}</textarea><br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" value="{{ quiz.date }}" required><br><br>

        <label for="duration">Duration (HH:MM):</label>
        <input type="time" id="duration" name="duration" value="{{ quiz.duration }}" required><br><br>

        <button type="submit">Update Quiz</button>
    </form>

    <a href="{{ url_for('manage_quizzes', chapter_id=quiz.chapter_id) }}">Back to Quizzes</a>
</body>
</html>
